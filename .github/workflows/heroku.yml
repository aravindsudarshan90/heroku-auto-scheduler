name: Heroku Smart Start/Stop (2 Apps)

on:
  schedule:
    # START window (7:30 AM – 9:30 AM IST)
    - cron: '0,30 1-4 * * *'

    # STOP window (7:30 PM – 9:30 PM IST)
    - cron: '0,30 13-16 * * *'

  workflow_dispatch:

jobs:
  control:
    runs-on: ubuntu-latest

    steps:
      - name: Start or Stop Apps (Safe Mode)
        run: |
          set -e

          HOUR=$(date -u +"%H")
          echo "🕒 Current UTC Hour: $HOUR"

          HEROKU_API="https://api.heroku.com"
          HEADER_AUTH="Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}"
          HEADER_TYPE="Content-Type: application/json"
          HEADER_ACCEPT="Accept: application/vnd.heroku+json; version=3"

          update_app () {
            APP_NAME=$1
            TARGET=$2

            echo "➡️ Processing $APP_NAME → target=$TARGET"

            RESPONSE=$(curl -s -X PATCH $HEROKU_API/apps/$APP_NAME/formation \
              -H "$HEADER_ACCEPT" \
              -H "$HEADER_AUTH" \
              -H "$HEADER_TYPE" \
              -d "{\"updates\":[{\"type\":\"web\",\"quantity\":$TARGET}]}" )

            echo "Response: $RESPONSE"

            if echo "$RESPONSE" | grep -q "error"; then
              echo "❌ Error updating $APP_NAME"
              exit 1
            else
              echo "✅ Success for $APP_NAME"
            fi
          }

          # START window (UTC 1–4 → IST 6:30–9:30)
          if [ "$HOUR" -ge 1 ] && [ "$HOUR" -le 4 ]; then
            echo "🚀 START WINDOW"

            update_app "japaneselanguagejobs" 1
            update_app "snrcbilling" 1

          # STOP window (UTC 13–16 → IST 6:30–9:30 PM)
          elif [ "$HOUR" -ge 13 ] && [ "$HOUR" -le 16 ]; then
            echo "🛑 STOP WINDOW"

            update_app "japaneselanguagejobs" 0
            update_app "snrcbilling" 0

          else
            echo "⏳ No action needed"
          fi
