name: Heroku Auto Start (Only Start)

on:
  schedule:
    - cron: '*/5 * * * *'   # runs every 5 mins (for testing)
  workflow_dispatch:

jobs:
  control:
    runs-on: ubuntu-latest

    steps:
      - name: Start Dyno
        run: |
          echo "STARTING APP"
          curl -X PATCH https://api.heroku.com/apps/japaneselanguagejobs/formation \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"updates":[{"type":"web","quantity":1}]}'
