name: Heroku Auto Start/Stop

on:
  schedule:
    - cron: '*/5 * * * *'   # runs every 5 mins (for testing)
  workflow_dispatch:        # allows manual run

jobs:
  control:
    runs-on: ubuntu-latest

    steps:
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Start/Stop Dyno
        run: |
          export HEROKU_API_KEY=${{ secrets.HEROKU_API_KEY }}

          MIN=$(date -u +"%M")

          if [ "$MIN" -lt 30 ]; then
            echo "STARTING APP"
            heroku ps:scale web=1 --app japaneselanguagejobs
          else
            echo "STOPPING APP"
            heroku ps:scale web=0 --app japaneselanguagejobs
          fi
